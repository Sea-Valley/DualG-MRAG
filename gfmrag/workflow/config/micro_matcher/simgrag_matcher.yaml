_target_: gfmrag.kg_construction.micro_matcher.SimGRAGMicroMatcher
embedding_model_name: sentence-transformers/all-mpnet-base-v2
embedding_device: cpu
embedding_batch_size: 64
local_files_only: true
vector_backend: faiss
vector_dim: 768
faiss_storage_dir: tmp/micro_matcher_faiss
milvus_uri: http://localhost:19530
node_collection: gfmrag_micro_nodes
relation_collection: gfmrag_micro_relations
node_sim_topk: 16
relation_sim_topk: 16
final_topk: 3
timeout_sec: 30
relation_gate_node_threshold: 0.6
relation_score_weight: 1.0
reverse_edge_penalty: 0.25
